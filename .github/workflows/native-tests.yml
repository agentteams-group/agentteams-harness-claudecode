name: Claude Code native tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: 6e093d3db3b2ed980ab54228e51c9d799425a905
          path: core
      - name: Check out the pinned Matrix transport
        run: git -C core submodule update --init deepseek-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Run SDK, Matrix and recovery tests
        env:
          AGENTTEAMS_CORE_DIR: ${{ github.workspace }}/core
          PYTHONPATH: ${{ github.workspace }}/core/shared/lib/telemetry:${{ github.workspace }}/core/shared/lib
        run: python -m pytest tests -q
