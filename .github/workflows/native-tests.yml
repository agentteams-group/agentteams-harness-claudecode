name: Claude Code native tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agentscope-ai/AgentTeams
          ref: 7838b07ad665c8ded76207f1bef05db650a151df
          path: core
      - name: Check out the pinned Matrix transport
        run: git -C core submodule update --init deepseek-harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run SDK, Matrix and recovery tests
        env:
          AGENTTEAMS_CORE_DIR: ${{ github.workspace }}/core
        run: python -m unittest discover -s tests -v
